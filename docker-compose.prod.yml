version: '3.8'

services:
  backend:
    image: ${ECR_REGISTRY}/lab-signoff-backend:${IMAGE_TAG}
    command: gunicorn lab_sign_off.wsgi:application --bind 0.0.0.0:8000
    env_file:
      - .env.prod
    networks:
      - lab_network

  frontend:
    image: ${ECR_REGISTRY}/lab-signoff-frontend:${IMAGE_TAG}
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - lab_network

networks:
  lab_network:
    driver: bridge